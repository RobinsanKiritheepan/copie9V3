<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Admin – Copie Courneuve9</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-wrap {
            width: 100%;
            max-width: 420px;
            padding: 1rem;
        }
        .login-card {
            border-radius: var(--radius-lg) !important;
            overflow: hidden;
            box-shadow: var(--shadow-md) !important;
        }
        .login-top {
            background: linear-gradient(135deg, #1E40AF, #2563EB);
            color: #fff;
            padding: 2.5rem 2rem 2rem;
            text-align: center;
        }
        .login-top h2 { font-weight: 800; margin: .5rem 0 .25rem; font-size: 1.5rem; }
        .login-top p  { opacity: .8; font-size: .88rem; margin: 0; }
        .login-body {
            padding: 2rem;
            background: #fff;
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-card card">
            <div class="login-top">
                <div style="font-size:2.5rem">🔐</div>
                <h2>Espace Admin</h2>
                <p>Copie Courneuve9</p>
            </div>
            <div class="login-body">
                <form id="loginForm" novalidate>
                    <div class="form-group">
                        <label for="password" style="font-weight:600;font-size:.9rem">Mot de passe</label>
                        <input type="password" class="form-control" id="password"
                               placeholder="Entrez le mot de passe" required autocomplete="current-password">
                        <div class="invalid-feedback">Veuillez entrer le mot de passe.</div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block" style="padding:.65rem">
                        Se connecter
                    </button>
                </form>
                <div id="errorMsg" class="alert alert-danger mt-3 d-none" role="alert" aria-live="assertive"></div>
                <div class="text-center mt-4">
                    <a href="index.html" class="text-muted" style="font-size:.85rem">← Retour au site</a>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var pwdInput = document.getElementById('password');
        var errorMsg = document.getElementById('errorMsg');
        var pwd = pwdInput.value;
        if (!pwd) { pwdInput.classList.add('is-invalid'); return; }
        pwdInput.classList.remove('is-invalid');
        var savedPwd = localStorage.getItem('adminPassword') || 'admin123';
        if (pwd === savedPwd) {
            localStorage.setItem('isAdmin', 'true');
            window.location.href = 'index.html';
        } else {
            errorMsg.textContent = 'Mot de passe incorrect. Veuillez réessayer.';
            errorMsg.classList.remove('d-none');
            pwdInput.value = '';
            pwdInput.focus();
        }
    });
    </script>
</body>
</html>
