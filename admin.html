<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Admin – Copie Courneuve9</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #f0f2f5; display: flex; align-items: center; min-height: 100vh; }
        .login-card {
            max-width: 420px;
            width: 100%;
            margin: auto;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,.15);
        }
        .login-header {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: #fff;
            padding: 2rem;
            border-radius: 16px 16px 0 0;
            text-align: center;
        }
        .login-header h2 { font-weight: 800; margin: 0; }
        .login-body { padding: 2rem; background: #fff; border-radius: 0 0 16px 16px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="login-header">
                <div style="font-size:2.5rem;margin-bottom:.5rem">🔐</div>
                <h2>Espace Admin</h2>
                <p class="mb-0" style="opacity:.85;font-size:.9rem">Copie Courneuve9</p>
            </div>
            <div class="login-body">
                <form id="loginForm" novalidate>
                    <div class="form-group">
                        <label for="password" class="font-weight-bold">Mot de passe</label>
                        <input type="password" class="form-control" id="password"
                               placeholder="Entrez le mot de passe" required autocomplete="current-password">
                        <div class="invalid-feedback">Veuillez entrer le mot de passe.</div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block font-weight-bold" style="border-radius:8px;padding:.75rem">
                        Se connecter
                    </button>
                </form>
                <div id="errorMsg" class="alert alert-danger mt-3 d-none" role="alert" aria-live="assertive"></div>
                <div class="text-center mt-4">
                    <a href="index.html" class="text-muted small">← Retour au site</a>
                </div>
            </div>
        </div>
    </div>
    <script>
    /*
     * Gestion de la connexion administrateur.
     * Le mot de passe par défaut est « admin123 ».
     * Si l'administrateur l'a modifié via l'interface, la nouvelle valeur
     * est stockée dans localStorage sous la clé « adminPassword ».
     */
    document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault();
        var pwdInput = document.getElementById('password');
        var errorMsg = document.getElementById('errorMsg');
        var pwd = pwdInput.value;
        if (!pwd) {
            pwdInput.classList.add('is-invalid');
            return;
        }
        pwdInput.classList.remove('is-invalid');
        var savedPwd = localStorage.getItem('adminPassword') || 'admin123';
        if (pwd === savedPwd) {
            localStorage.setItem('isAdmin', 'true');
            window.location.href = 'index.html';
        } else {
            errorMsg.textContent = 'Mot de passe incorrect. Veuillez réessayer.';
            errorMsg.classList.remove('d-none');
            pwdInput.value = '';
            pwdInput.focus();
        }
    });
    </script>
</body>
</html>
