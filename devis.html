    <!-- Section formulaire -->
    <section class="container form-section py-4">
        <h2 class="text-center mb-4" data-editable="devis_title">Demande de Devis</h2>
        <form id="quoteForm">
            <div class="form-group">
                <label for="name">Nom</label>
                <input type="text" class="form-control" id="name" placeholder="Votre nom" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Votre email" required>
            </div>
            <div class="form-group">
                <label for="phone">Téléphone</label>
                <input type="tel" class="form-control" id="phone" placeholder="Votre numéro de téléphone" required>
            </div>
            <div class="form-group">
                <label for="details">Détails de la demande</label>
                <textarea class="form-control" id="details" rows="3" placeholder="Décrivez votre demande ici" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Envoyer la demande</button>
        </form>
    </section>

    <!-- Script simple pour afficher un message de confirmation -->
    <script>
        document.getElementById('quoteForm').addEventListener('submit', function(event) {
            event.preventDefault();
            alert('Votre demande a été envoyée. Nous vous répondrons dans les plus brefs délais.');
            this.reset();
        });
